version: '3.8'

services:
  captcha:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "2121:2121"
    environment:
      - GOOGLE_ENTERPRISE_API_KEY=${GOOGLE_ENTERPRISE_API_KEY}
      - GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      # Per-site variables (add one block per site):
      # - {SITE_NAME_UPPERCASE}_RECAPTCHA_SITE_KEY=${...}
      # - {SITE_NAME_UPPERCASE}_EMAIL_TO=${...}
      # - {SITE_NAME_UPPERCASE}_EMAIL_FROM=${...}
    restart: unless-stopped
